# Local benchmark environment. NOT for production: credentials are fixed and public.
#
#   postgres   - Airflow metadata DB + the `source` DB holding bench.events
#   s3         - Versity S3 Gateway (S3-compatible, posix backend)
#   airflow-*  - Airflow 3.4 with LocalExecutor; tasks run inside airflow-scheduler

x-airflow-common: &airflow-common
  image: airflow-transfer-bench:local
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: transfer-bench-local-only
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"

    # --- Language SDKs: one Dag bundle per handler bundle, one coordinator per language.
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [
        {"name": "dags-folder", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {}},
        {"name": "go-handlers", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {"path": "/opt/airflow/bundles/go"}},
        {"name": "java-handlers", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {"path": "/opt/airflow/bundles/java"}},
        {"name": "ts-handlers", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {"path": "/opt/airflow/bundles/typescript"}}
      ]
    AIRFLOW__SDK__COORDINATORS: >-
      {
        "go":   {"classpath": "airflow.sdk.coordinators.executable.ExecutableCoordinator", "kwargs": {"task_handler_bundle_name": "go-handlers"}},
        "java": {"classpath": "airflow.sdk.coordinators.java.JavaCoordinator", "kwargs": {"task_handler_bundle_name": "java-handlers"}},
        "ts":   {"classpath": "airflow.sdk.coordinators.node.NodeCoordinator", "kwargs": {"task_handler_bundle_name": "ts-handlers"}}
      }
    AIRFLOW__SDK__QUEUE_TO_COORDINATOR: '{"golang": "go", "java": "java", "typescript": "ts"}'

    # --- Connections used by every implementation.
    AIRFLOW_CONN_BENCH_POSTGRES: postgresql://bench:bench@postgres:5432/source
    AIRFLOW_CONN_BENCH_S3: >-
      {"conn_type": "aws", "login": "benchaccess", "password": "benchsecret",
       "extra": {"endpoint_url": "http://s3:7070", "region_name": "us-east-1",
                 "config_kwargs": {"request_checksum_calculation": "when_required"}}}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./results:/opt/airflow/results
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    s3:
      condition: service_started

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=200"]
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  s3:
    image: versity/versitygw:v1.11.0
    command: ["--access", "benchaccess", "--secret", "benchsecret", "posix", "/data"]
    volumes:
      - s3-data:/data
    ports:
      - "7070:7070"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        python /opt/airflow/scripts/create_bucket.py
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"]
      interval: 10s
      retries: 30
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # Tasks execute here (LocalExecutor). Pin resources so runs are comparable.
    cpus: ${BENCH_CPUS:-2}
    mem_limit: ${BENCH_MEM:-6g}
    depends_on:
      <<: *airflow-depends
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  s3-data:
